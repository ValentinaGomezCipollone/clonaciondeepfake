<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Pregunta 2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@0,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body class="quiz-body">

    <!-- Botón Home -->
    <a href="index.html" class="btn-home-icon" aria-label="Volver al inicio">
        <img src="img/home.png" alt="Home" class="home-icon-img">
    </a>

    <!-- Blandas de Esquinas -->
    <img src="img/Blandadegradadamulticolor.png" alt="" class="blob-bottom-left">
    <img src="img/Blandaarribaizquierda.png" alt="" class="blob-top-right">

    <main class="quiz-wrapper">
        <h1 class="quiz-title">Poné a prueba lo que aprendiste:</h1>

        <!-- Tarjeta Transparente -->
        <div class="quiz-card-transparent">
            
            <div class="quiz-content">
                <div class="quiz-question-header">
                    <div class="question-number">2</div>
                    <h2 class="question-text">
                        ¿Qué artista firmó una carta abierta con la Artist Rights Alliance para frenar el avance de la IA?
                    </h2>
                </div>

                <form class="quiz-options-form" id="quiz-form-2">
                    <label class="quiz-option option-with-avatar">
                        <input type="radio" name="question2" value="ice-cube">
                        <span class="custom-radio"></span>
                        <img src="img/icecube.png" alt="Ice Cube" class="artist-avatar">
                        <span class="option-label">Ice Cube</span>
                    </label>

                    <label class="quiz-option option-with-avatar">
                        <input type="radio" name="question2" value="billie-eilish">
                        <span class="custom-radio"></span>
                        <img src="img/billie.png" alt="Billie Eilish" class="artist-avatar">
                        <span class="option-label">Billie Eilish</span>
                    </label>

                    <label class="quiz-option option-with-avatar">
                        <input type="radio" name="question2" value="david-guetta">
                        <span class="custom-radio"></span>
                        <img src="img/david.png" alt="David Guetta" class="artist-avatar">
                        <span class="option-label">David Guetta</span>
                    </label>
                </form>
            </div>

            <!-- Cerebro Flotante -->
            <img src="img/cerebro.png" alt="Cerebro IA" class="brain-img-floating">

        </div>

        <!-- Fila Inferior con Paginador (Paso 2 activo) y Botón -->
        <div class="quiz-footer-row">
            
            <div class="quiz-progress-bar">
                <span class="progress-step"></span>
                <span class="progress-step active"></span>
                <span class="progress-step"></span>
                <span class="progress-step"></span>
                <span class="progress-step"></span>
            </div>

            <button type="button" class="btn-quiz-action btn-confirm-response" id="btn-confirm-2">
                Confirmar respuesta
            </button>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
