<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproducí, escuchá y elegí - Pantalla 5</title>

    <!-- Google Fonts: Poppins (800) y Averia Serif Libre -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@1,800&display=swap" rel="stylesheet">

    <!-- Hoja de estilos unificada -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Botón Home (Imagen de la casita) -->
    <a href="index.html" class="btn-home" aria-label="Volver al inicio">
        <img src="img/home.png" alt="Inicio" class="home-icon-img">
    </a>

    <!-- Elementos decorativos Neón -->
    <img src="img/Blandaarribaizquierda.png" alt="Decoración Neón Superior" class="blob blob-top-right">
    <img src="img/Blandadegradadamulticolor.png" alt="Decoración Neón Inferior" class="blob blob-bottom-left-p5">

    <!-- Contenedor general sin rectángulo oscuro -->
    <section class="screen-wrapper-p5">

        <!-- Título principal -->
        <header class="header-title-p5">
            <h1 class="title-text-p5">REPRODUCÍ, ESCUCHA Y ELEGÍ</h1>
        </header>

        <!-- Barra Reproductora de Audio -->
        <div class="audio-player-card">
            <button id="btn-play-p5" class="btn-play-circle" aria-label="Reproducir o pausar audio">
                <!-- Icono Play -->
                <svg id="icon-play-p5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <!-- Icono Pause -->
                <svg id="icon-pause-p5" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <!-- Imagen de la onda sonora (musica.png) -->
            <div class="waveform-wrapper">
                <img src="img/musica.png" alt="Onda de audio" class="waveform-img">
            </div>

            <!-- Audio HTML5 -->
            <audio id="audio-p5" src="audio/cancion.mp3" preload="metadata"></audio>
        </div>

        <!-- Opciones Clickeables (A / B) -->
        <div class="options-container">

            <!-- Opción A: Voz humana real -->
            <button class="option-card option-a" data-option="A">
                <img src="img/onda.png" alt="Decoración onda" class="option-bg-wave">
                <span class="option-label label-a">OPCIÓN A</span>
                <span class="option-title">Voz humana real</span>
            </button>

            <!-- Opción B: Generado por IA -->
            <button class="option-card option-b" data-option="B">
                <img src="img/onda.png" alt="Decoración onda" class="option-bg-wave">
                <span class="option-label label-b">OPCIÓN B</span>
                <span class="option-title">Generado por IA</span>
            </button>

        </div>

    </section>

    <!-- Archivo JS unificado -->
    <script src="script.js"></script>
</body>
</html>
