<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake - Clonación de voces con IA en la música</title>
    
    <!-- Google Fonts: Poppins (800), Averia Serif Libre y Kaushan Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@300;400;700&family=Kaushan+Script&family=Poppins:wght@800&display=swap" rel="stylesheet">
    
    <!-- Hoja de estilos CSS externa -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Elementos fuera del rectángulo (Blandas neón) -->
    <img src="img/Blandaarribaizquierda.png" alt="Decoración Neón Superior" class="blob blob-top-right">
    <img src="img/Blandadegradadamulticolor.png" alt="Decoración Neón Inferior" class="blob blob-bottom-left">

    <!-- Rectángulo central principal -->
    <main class="card-container">
        
        <!-- Bloque Superior Izquierdo: Título y Subtítulo dividido en 2 imágenes -->
<header class="header-title">
    <img src="img/deepfake.png" alt="Deepfake" class="title-img">
    
    <div class="subtitle-container">
        <img src="img/subtitulo.png" alt="Clonación de voces con IA" class="sub-left-img">
        <img src="img/enlamusica.png" alt="en la música." class="sub-right-img">
    </div>
</header>

        <!-- Bloque Central: Texto descriptivo y Botón -->
        <section class="center-content">
            <p class="description">
                El conflicto entre autenticidad y los<br>
                derechos de los artistas.
            </p>
            <button id="btn-empezar" class="btn-empezar">Empezar</button>
        </section>

        <!-- Bloque Derecho: Imagen de Cerati -->
        <div class="artist-wrapper">
            <img src="img/cerati.png" alt="Cerati 3D Wireframe" class="artist-img">
        </div>

    </main>

    <!-- Archivo JS externo -->
    <script src="script.js"></script>
</body>
</html>
